name: Build Desktop App

on:
  workflow_call:
    inputs:
      channel:
        description: "Release channel (stable or canary)"
        required: true
        type: string
      version_suffix:
        description: "Version suffix to append (e.g., -canary). Empty for stable."
        required: false
        type: string
        default: ""
      electron_builder_config:
        description: "Electron builder config file"
        required: false
        type: string
        default: "electron-builder.ts"
      artifact_prefix:
        description: "Prefix for artifact names"
        required: false
        type: string
        default: "desktop"
      artifact_retention_days:
        description: "Number of days to retain artifacts"
        required: false
        type: number
        default: 30
      build_macos:
        description: "Whether to build macOS artifacts"
        required: false
        type: boolean
        default: true
      macos_arches_json:
        description: "JSON array of macOS architectures to build"
        required: false
        type: string
        default: '["arm64","x64"]'
      build_linux:
        description: "Whether to build Linux artifacts"
        required: false
        type: boolean
        default: true
      mac_signing:
        description: "macOS signing mode: auto, required, or unsigned_internal"
        required: false
        type: string
        default: "auto"
      macos_artifact_mode:
        description: "macOS artifact mode: full builds DMG+ZIP, zip_only builds the updater ZIP only."
        required: false
        type: string
        default: "full"
      upload_resource_pack_artifacts:
        description: "Whether to upload resource pack artifacts/object storage payloads. Artifact-only quick validation can skip this."
        required: false
        type: boolean
        default: true
      require_resource_pack_object_storage:
        description: "Whether missing object-storage secrets should fail the build. Published releases must require this."
        required: false
        type: boolean
        default: false
      bundle_cli:
        description: "Whether to include the bundled Superset CLI binary in the base desktop artifact."
        required: false
        type: boolean
        default: true
      upload_sourcemaps:
        description: "Whether to generate and upload desktop Sentry sourcemaps during compile."
        required: false
        type: boolean
        default: true

env:
  DESKTOP_PRODUCTION_WEB_URL: http://bj1.v.lhb.ink:63000
  DESKTOP_PRODUCTION_API_URL: http://bj1.v.lhb.ink:63001
  DESKTOP_PRODUCTION_ELECTRIC_URL: http://bj1.v.lhb.ink:63012
  DESKTOP_PRODUCTION_RELAY_URL: http://bj1.v.lhb.ink:63013

jobs:
  build-macos:
    name: Build - macOS (${{ matrix.arch }})
    if: ${{ inputs.build_macos }}
    runs-on: macos-latest
    environment: production

    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(inputs.macos_arches_json) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        id: setup-bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Cache dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ steps.setup-bun.outputs.bun-revision }}-${{ hashFiles('bun.lock', 'package.json', 'apps/desktop/package.json', 'packages/*/package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-${{ steps.setup-bun.outputs.bun-revision }}-

      - name: Cache Electron packaging downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/.cache/electron
            ~/.cache/electron-builder
          key: ${{ runner.os }}-${{ matrix.arch }}-electron-packaging-${{ hashFiles('apps/desktop/package.json', 'bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-electron-packaging-

      - name: Install dependencies
        run: bun install --frozen --ignore-scripts --minimum-release-age=0

      - name: Install desktop native dependencies
        working-directory: apps/desktop
        run: bun run install:deps

      - name: Set version suffix
        if: inputs.version_suffix != ''
        working-directory: apps/desktop
        run: |
          # Read current version and append suffix
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          NEW_VERSION="${CURRENT_VERSION}${{ inputs.version_suffix }}"
          echo "Setting version to: $NEW_VERSION"
          # Update package.json version using node
          node -e "
            const fs = require('fs');
            const pkg = require('./package.json');
            pkg.version = '$NEW_VERSION';
            fs.writeFileSync('./package.json', JSON.stringify(pkg, null, '\t') + '\n');
          "
          echo "Updated package.json version to $NEW_VERSION"

      - name: Clean dev folder
        working-directory: apps/desktop
        run: bun run clean:dev

      - name: Generate file icons
        working-directory: apps/desktop
        run: bun run generate:icons

      - name: Compile app with electron-vite
        working-directory: apps/desktop
        env:
          NEXT_PUBLIC_POSTHOG_KEY: ${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
          NEXT_PUBLIC_POSTHOG_HOST: ${{ secrets.NEXT_PUBLIC_POSTHOG_HOST }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GH_CLIENT_ID: ${{ secrets.GH_CLIENT_ID }}
          NEXT_PUBLIC_WEB_URL: ${{ env.DESKTOP_PRODUCTION_WEB_URL }}
          NEXT_PUBLIC_API_URL: ${{ env.DESKTOP_PRODUCTION_API_URL }}
          NEXT_PUBLIC_DOCS_URL: ${{ secrets.NEXT_PUBLIC_DOCS_URL }}
          NEXT_PUBLIC_STREAMS_URL: ${{ secrets.NEXT_PUBLIC_STREAMS_URL }}
          NEXT_PUBLIC_ELECTRIC_URL: ${{ env.DESKTOP_PRODUCTION_ELECTRIC_URL }}
          SENTRY_DSN_DESKTOP: ${{ secrets.SENTRY_DSN_DESKTOP }}
          SENTRY_AUTH_TOKEN: ${{ inputs.upload_sourcemaps && secrets.SENTRY_AUTH_TOKEN || '' }}
          RELAY_URL: ${{ env.DESKTOP_PRODUCTION_RELAY_URL }}
          SUPERSET_WORKSPACE_NAME: superset
          TARGET_ARCH: ${{ matrix.arch }}
          DESKTOP_BUNDLE_CLI: ${{ inputs.bundle_cli }}
        run: bun run compile:app

      - name: Report package size after compile
        working-directory: apps/desktop
        run: bun run report:size --top=15

      - name: Install target platform optional dependencies
        run: bun install --frozen --ignore-scripts --minimum-release-age=0 --cpu=${{ matrix.arch }} --os=darwin

      - name: Build desktop resource packs
        working-directory: apps/desktop
        env:
          BUNDLE_CLI: ${{ inputs.bundle_cli }}
          SUPERSET_RESOURCE_PACK_BASE_URL: ${{ secrets.SUPERSET_RESOURCE_PACK_BASE_URL }}
          TARGET_ARCH: ${{ matrix.arch }}
          TARGET_PLATFORM: darwin
          UPLOAD_RESOURCE_PACK_ARTIFACTS: ${{ inputs.upload_resource_pack_artifacts }}
        run: |
          if [[ "$UPLOAD_RESOURCE_PACK_ARTIFACTS" != "true" ]]; then
            echo "::notice::Skipping runtime pack build for artifact-only validation."
            mkdir -p dist/resources/pack-system
            cp src/resources/pack-system/pack-manifest-index.json dist/resources/pack-system/pack-manifest-index.json
            exit 0
          fi
          bun run build:trellis-pack -- --out-dir dist/resource-packs --app-index-out dist/resources/pack-system/pack-manifest-index.json
          bun run build:claude-agent-pack -- --out-dir dist/resource-packs --app-index-out dist/resources/pack-system/pack-manifest-index.json
          bun run build:mastracode-pack -- --out-dir dist/resource-packs --app-index-out dist/resources/pack-system/pack-manifest-index.json
          if [[ "$BUNDLE_CLI" != "true" && "$UPLOAD_RESOURCE_PACK_ARTIFACTS" == "true" ]]; then
            bun run build:cli-pack -- --out-dir dist/resource-packs --app-index-out dist/resources/pack-system/pack-manifest-index.json
          else
            echo "::notice::Skipping Superset CLI runtime pack (bundle_cli=$BUNDLE_CLI, upload_resource_pack_artifacts=$UPLOAD_RESOURCE_PACK_ARTIFACTS)."
          fi
          bun run validate:trellis-runtime -- --node-modules dist/resource-packs/trellis-runtime/*/node_modules

      - name: Upload desktop resource pack artifact
        if: inputs.upload_resource_pack_artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ inputs.artifact_prefix }}-mac-${{ matrix.arch }}-resource-packs
          path: apps/desktop/dist/resource-packs/**
          retention-days: ${{ inputs.artifact_retention_days }}
          if-no-files-found: error

      - name: Upload desktop resource packs to object storage
        if: inputs.upload_resource_pack_artifacts
        working-directory: apps/desktop
        env:
          SUPERSET_OBJECT_STORAGE_ENDPOINT: ${{ secrets.SUPERSET_OBJECT_STORAGE_ENDPOINT }}
          SUPERSET_OBJECT_STORAGE_BUCKET: ${{ secrets.SUPERSET_OBJECT_STORAGE_BUCKET }}
          SUPERSET_OBJECT_STORAGE_REGION: ${{ secrets.SUPERSET_OBJECT_STORAGE_REGION }}
          SUPERSET_OBJECT_STORAGE_ACCESS_KEY: ${{ secrets.SUPERSET_OBJECT_STORAGE_ACCESS_KEY }}
          SUPERSET_OBJECT_STORAGE_SECRET_KEY: ${{ secrets.SUPERSET_OBJECT_STORAGE_SECRET_KEY }}
          SUPERSET_OBJECT_STORAGE_FORCE_PATH_STYLE: ${{ secrets.SUPERSET_OBJECT_STORAGE_FORCE_PATH_STYLE }}
          REQUIRE_RESOURCE_PACK_OBJECT_STORAGE: ${{ inputs.require_resource_pack_object_storage }}
        run: |
          if [[ -z "${SUPERSET_OBJECT_STORAGE_ENDPOINT:-}" || -z "${SUPERSET_OBJECT_STORAGE_BUCKET:-}" || -z "${SUPERSET_OBJECT_STORAGE_ACCESS_KEY:-}" || -z "${SUPERSET_OBJECT_STORAGE_SECRET_KEY:-}" ]]; then
            if [[ "$REQUIRE_RESOURCE_PACK_OBJECT_STORAGE" == "true" ]]; then
              echo "::error::Published desktop builds require SUPERSET_OBJECT_STORAGE_* secrets so on-demand resource packs are available to users."
              exit 1
            fi
            echo "::warning::Skipping desktop resource pack object-storage upload because SUPERSET_OBJECT_STORAGE_* secrets are incomplete."
            exit 0
          fi
          bun run upload:resource-packs -- --pack-dir dist/resource-packs --prefix packs

      - name: Prepare native runtime modules
        working-directory: apps/desktop
        env:
          TARGET_ARCH: ${{ matrix.arch }}
          TARGET_PLATFORM: darwin
        run: |
          bun run copy:native-modules
          bun run validate:native-runtime

      - name: Build Electron app
        working-directory: apps/desktop
        env:
          MAC_CERTIFICATE: ${{ secrets.MAC_CERTIFICATE }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          MAC_APPLE_ID: ${{ secrets.APPLE_ID }}
          MAC_APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          MAC_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TARGET_ARCH: ${{ matrix.arch }}
          TARGET_PLATFORM: darwin
          MAC_SIGNING_MODE: ${{ inputs.mac_signing }}
          MACOS_ARTIFACT_MODE: ${{ inputs.macos_artifact_mode }}
          ELECTRON_BUILDER_NPM_REBUILD: "false"
        run: |
          case "$MACOS_ARTIFACT_MODE" in
            full)
              PACKAGE_TARGET_ARGS=("--${{ matrix.arch }}")
              ;;
            zip_only)
              echo "::notice::macOS artifact mode is zip_only; skipping DMG generation for artifact validation."
              PACKAGE_TARGET_ARGS=("--mac" "zip" "--${{ matrix.arch }}")
              ;;
            *)
              echo "::error::Unsupported macos_artifact_mode: $MACOS_ARTIFACT_MODE"
              exit 1
              ;;
          esac

          if [[ "$MAC_SIGNING_MODE" == "unsigned_internal" ]]; then
            echo "::warning::macOS signing mode is unsigned_internal; building ad-hoc signed internal macOS artifacts without notarization."
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            export AD_HOC_MAC_CODE_SIGNING=true
          elif [[ -n "${MAC_CERTIFICATE:-}" && -n "${MAC_CERTIFICATE_PASSWORD:-}" && -n "${MAC_APPLE_ID:-}" && -n "${MAC_APPLE_ID_PASSWORD:-}" && -n "${MAC_APPLE_TEAM_ID:-}" ]]; then
            echo "macOS signing secrets found; building signed and notarized app."
            export CSC_LINK="$MAC_CERTIFICATE"
            export CSC_KEY_PASSWORD="$MAC_CERTIFICATE_PASSWORD"
            export APPLE_ID="$MAC_APPLE_ID"
            export APPLE_APP_SPECIFIC_PASSWORD="$MAC_APPLE_ID_PASSWORD"
            export APPLE_TEAM_ID="$MAC_APPLE_TEAM_ID"
          else
            if [[ "$MAC_SIGNING_MODE" == "required" ]]; then
              echo "::error::macOS signing was required, but signing/notarization secrets are incomplete."
              echo "::error::Required secrets: MAC_CERTIFICATE, MAC_CERTIFICATE_PASSWORD, APPLE_ID, APPLE_ID_PASSWORD, APPLE_TEAM_ID."
              exit 1
            fi
            echo "::warning::macOS signing secrets are incomplete; building ad-hoc signed internal macOS artifacts without notarization."
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            export AD_HOC_MAC_CODE_SIGNING=true
          fi

          node ./node_modules/electron-builder/cli.js --publish never --config ${{ inputs.electron_builder_config }} "${PACKAGE_TARGET_ARGS[@]}"

      - name: Check package size budget
        working-directory: apps/desktop
        run: bun run check:package-budget -- --require-artifacts

      - name: Capture runtime performance budget
        if: matrix.arch == 'arm64'
        working-directory: apps/desktop
        env:
          DESKTOP_AUTOMATION_PORT: "9322"
          SUPERSET_DISABLE_AUTO_UPDATES: "1"
          SUPERSET_HOME_DIR: ${{ runner.temp }}/superset-runtime-perf-home
        run: |
          set -euo pipefail
          mkdir -p performance-reports "$SUPERSET_HOME_DIR"
          APP_DIR=$(find release -maxdepth 2 -name "*.app" -type d | head -1)
          if [ -z "$APP_DIR" ]; then
            echo "::error::No .app bundle found in release/"
            ls -la release/
            exit 1
          fi

          EXECUTABLE_NAME=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP_DIR/Contents/Info.plist")
          APP_EXECUTABLE="$APP_DIR/Contents/MacOS/$EXECUTABLE_NAME"
          "$APP_EXECUTABLE" > performance-reports/runtime-app.log 2>&1 &
          APP_PID=$!
          cleanup() {
            kill "$APP_PID" 2>/dev/null || true
            wait "$APP_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 60); do
            if bun run --cwd ../.. desktop:automation -- window-info --json > performance-reports/window-info.json 2> performance-reports/window-info.err &&
              node -e 'const fs=require("node:fs"); const info=JSON.parse(fs.readFileSync("performance-reports/window-info.json","utf8")); if (!info || typeof info.url !== "string") process.exit(1);'; then
              break
            fi
            sleep 1
          done
          if ! node -e 'const fs=require("node:fs"); const info=JSON.parse(fs.readFileSync("performance-reports/window-info.json","utf8")); if (!info || typeof info.url !== "string") process.exit(1);' 2>/dev/null; then
            echo "::error::Packaged desktop app did not expose Desktop Automation CDP in time."
            cat performance-reports/window-info.err || true
            cat performance-reports/runtime-app.log || true
            exit 1
          fi

          bun run report:runtime -- \
            --duration=10000 \
            --json-out apps/desktop/performance-reports/runtime-performance-ci.json \
            --markdown-out apps/desktop/performance-reports/runtime-performance-ci.md
          bun run check:runtime-budget -- \
            --report performance-reports/runtime-performance-ci.json \
            --require-report

      - name: Upload runtime performance report
        if: always() && matrix.arch == 'arm64'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ inputs.artifact_prefix }}-mac-${{ matrix.arch }}-runtime-performance
          path: apps/desktop/performance-reports/*
          retention-days: ${{ inputs.artifact_retention_days }}
          if-no-files-found: warn

      - name: Verify resource pack runtimes are pack-only
        working-directory: apps/desktop
        run: |
          APP_DIR=$(find release -maxdepth 2 -name "*.app" -type d | head -1)
          if [ -z "$APP_DIR" ]; then
            echo "::error::No .app bundle found in release/"
            ls -la release/
            exit 1
          fi
          if find "$APP_DIR/Contents/Resources" \( -path "*/node_modules/@mindfoldhq/trellis*" -o -path "*/node_modules/@anthropic-ai/claude-agent-sdk*" -o -path "*/node_modules/@anthropic-ai/sdk*" -o -path "*/node_modules/@browserbasehq*" -o -path "*/node_modules/@modelcontextprotocol/sdk*" -o -path "*/node_modules/json-schema-to-ts*" -o -path "*/node_modules/ts-algebra*" -o -path "*/node_modules/mastracode*" -o -path "*/node_modules/@mastra/agent-browser*" -o -path "*/node_modules/@mastra/duckdb*" -o -path "*/node_modules/@mastra/memory*" -o -path "*/node_modules/@mastra/stagehand*" -o -path "*/node_modules/@duckdb*" -o -path "*/node_modules/chromium-bidi*" -o -path "*/node_modules/patchright-core*" -o -path "*/node_modules/playwright*" -o -path "*/node_modules/playwright-core*" -o -path "*/node_modules/webdriver*" -o -path "*/node_modules/webdriverio*" \) -print -quit | grep -q .; then
            echo "::error::Trellis, Claude Agent, and MastraCode/DuckDB runtimes must be delivered by resource packs, not bundled in app resources."
            exit 1
          fi
          ASAR_PATH="$APP_DIR/Contents/Resources/app.asar" NODE_PATH="../../node_modules/.bun/node_modules" node <<'NODE'
          const asar = require("@electron/asar");
          const entries = asar.listPackage(process.env.ASAR_PATH);
          const forbidden = entries.filter((entry) =>
            entry.includes("/node_modules/@mindfoldhq/trellis") ||
            entry.includes("/node_modules/@anthropic-ai/claude-agent-sdk") ||
            entry.includes("/node_modules/@anthropic-ai/sdk") ||
            entry.includes("/node_modules/@browserbasehq") ||
            entry.includes("/node_modules/@modelcontextprotocol/sdk") ||
            entry.includes("/node_modules/json-schema-to-ts") ||
            entry.includes("/node_modules/ts-algebra") ||
            entry.includes("/node_modules/mastracode") ||
            entry.includes("/node_modules/@mastra/agent-browser") ||
            entry.includes("/node_modules/@mastra/duckdb") ||
            entry.includes("/node_modules/@mastra/memory") ||
            entry.includes("/node_modules/@mastra/stagehand") ||
            entry.includes("/node_modules/@duckdb") ||
            entry.includes("/node_modules/chromium-bidi") ||
            entry.includes("/node_modules/patchright-core") ||
            entry.includes("/node_modules/playwright") ||
            entry.includes("/node_modules/playwright-core") ||
            entry.includes("/node_modules/webdriver") ||
            entry.includes("/node_modules/webdriverio") ||
            entry.includes("/dist/resource-packs")
          );
          if (forbidden.length > 0) {
            console.error("::error::Resource-pack runtime payloads must not be bundled in app.asar.");
            console.error(forbidden.slice(0, 20).join("\n"));
            process.exit(1);
          }
          NODE
          test -f dist/resources/pack-system/pack-manifest-index.json

      - name: Verify macOS auto-update metadata and CLI delivery
        if: inputs.macos_artifact_mode == 'full'
        working-directory: apps/desktop
        env:
          BUNDLE_CLI: ${{ inputs.bundle_cli }}
        run: |
          # electron-builder uses mac-arm64/ for arm64 and mac/ for x64 (when host is arm64)
          APP_DIR=$(find release -maxdepth 2 -name "*.app" -type d | head -1)
          if [ -z "$APP_DIR" ]; then
            echo "::error::No .app bundle found in release/"
            ls -la release/
            exit 1
          fi
          echo "Found app bundle: $APP_DIR"
          test -f "$APP_DIR/Contents/Resources/app-update.yml" || {
            echo "::error::app-update.yml missing from $APP_DIR/Contents/Resources/ — auto-update will be broken"
            exit 1
          }
          CLI_BIN="$APP_DIR/Contents/Resources/resources/bin/superset"
          if [[ "$BUNDLE_CLI" == "true" ]]; then
            test -x "$CLI_BIN" || {
              echo "::error::Bundled Superset CLI missing or not executable at $CLI_BIN"
              exit 1
            }
            "$CLI_BIN" --version
          else
            if [[ -e "$CLI_BIN" ]]; then
              echo "::error::Bundled Superset CLI should not exist when bundle_cli=false: $CLI_BIN"
              exit 1
            fi
            CLI_PACK_BIN=$(find dist/resource-packs/superset-cli-runtime -path "*/bin/superset" -type f -perm -111 | head -1)
            if [[ -z "$CLI_PACK_BIN" ]]; then
              echo "::error::Superset CLI runtime pack binary missing while bundle_cli=false"
              find dist/resource-packs/superset-cli-runtime -maxdepth 4 -type f 2>/dev/null || true
              exit 1
            fi
            "$CLI_PACK_BIN" --version
          fi

      - name: Verify macOS code signing status
        working-directory: apps/desktop
        env:
          MAC_CERTIFICATE: ${{ secrets.MAC_CERTIFICATE }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          MAC_APPLE_ID: ${{ secrets.APPLE_ID }}
          MAC_APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          MAC_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          APP_DIR=$(find release -maxdepth 2 -name "*.app" -type d | head -1)
          if [[ -z "$APP_DIR" ]]; then
            echo "::error::No .app bundle found in release/"
            exit 1
          fi

          codesign --verify --deep --strict --verbose=2 "$APP_DIR"

          if [[ -n "${MAC_CERTIFICATE:-}" && -n "${MAC_CERTIFICATE_PASSWORD:-}" && -n "${MAC_APPLE_ID:-}" && -n "${MAC_APPLE_ID_PASSWORD:-}" && -n "${MAC_APPLE_TEAM_ID:-}" ]]; then
            spctl --assess --type execute --verbose=4 "$APP_DIR"
            echo "macOS app is signed and passed Gatekeeper assessment."
          else
            echo "::warning::macOS app is ad-hoc signed but not Developer ID notarized. Downloaded artifacts require quarantine removal for internal testing."
          fi

      - name: Upload DMG artifact
        if: inputs.macos_artifact_mode == 'full'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ inputs.artifact_prefix }}-mac-${{ matrix.arch }}-dmg
          path: apps/desktop/release/*.dmg
          retention-days: ${{ inputs.artifact_retention_days }}
          if-no-files-found: error

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ inputs.artifact_prefix }}-mac-${{ matrix.arch }}-zip
          path: apps/desktop/release/*.zip
          retention-days: ${{ inputs.artifact_retention_days }}
          if-no-files-found: error

      - name: Upload auto-update manifest
        if: inputs.macos_artifact_mode == 'full'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ inputs.artifact_prefix }}-mac-${{ matrix.arch }}-update-manifest
          path: apps/desktop/release/*-mac.yml
          retention-days: ${{ inputs.artifact_retention_days }}
          if-no-files-found: error

  build-linux:
    name: Build - Linux (x64)
    if: ${{ inputs.build_linux }}
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        id: setup-bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Cache dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ steps.setup-bun.outputs.bun-revision }}-${{ hashFiles('bun.lock', 'package.json', 'apps/desktop/package.json', 'packages/*/package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-${{ steps.setup-bun.outputs.bun-revision }}-

      - name: Cache Electron packaging downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: ${{ runner.os }}-x64-electron-packaging-${{ hashFiles('apps/desktop/package.json', 'bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-x64-electron-packaging-

      - name: Install dependencies
        run: bun install --frozen --ignore-scripts --minimum-release-age=0

      - name: Install Linux native build deps
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxkbfile-dev

      - name: Install desktop native dependencies
        working-directory: apps/desktop
        run: bun run install:deps

      - name: Set version suffix
        if: inputs.version_suffix != ''
        working-directory: apps/desktop
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          NEW_VERSION="${CURRENT_VERSION}${{ inputs.version_suffix }}"
          echo "Setting version to: $NEW_VERSION"
          node -e "
            const fs = require('fs');
            const pkg = require('./package.json');
            pkg.version = '$NEW_VERSION';
            fs.writeFileSync('./package.json', JSON.stringify(pkg, null, '\t') + '\n');
          "
          echo "Updated package.json version to $NEW_VERSION"

      - name: Clean dev folder
        working-directory: apps/desktop
        run: bun run clean:dev

      - name: Generate file icons
        working-directory: apps/desktop
        run: bun run generate:icons

      - name: Compile app with electron-vite
        working-directory: apps/desktop
        env:
          NEXT_PUBLIC_POSTHOG_KEY: ${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
          NEXT_PUBLIC_POSTHOG_HOST: ${{ secrets.NEXT_PUBLIC_POSTHOG_HOST }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GH_CLIENT_ID: ${{ secrets.GH_CLIENT_ID }}
          NEXT_PUBLIC_WEB_URL: ${{ env.DESKTOP_PRODUCTION_WEB_URL }}
          NEXT_PUBLIC_API_URL: ${{ env.DESKTOP_PRODUCTION_API_URL }}
          NEXT_PUBLIC_DOCS_URL: ${{ secrets.NEXT_PUBLIC_DOCS_URL }}
          NEXT_PUBLIC_STREAMS_URL: ${{ secrets.NEXT_PUBLIC_STREAMS_URL }}
          NEXT_PUBLIC_ELECTRIC_URL: ${{ env.DESKTOP_PRODUCTION_ELECTRIC_URL }}
          SENTRY_DSN_DESKTOP: ${{ secrets.SENTRY_DSN_DESKTOP }}
          SENTRY_AUTH_TOKEN: ${{ inputs.upload_sourcemaps && secrets.SENTRY_AUTH_TOKEN || '' }}
          RELAY_URL: ${{ env.DESKTOP_PRODUCTION_RELAY_URL }}
          SUPERSET_WORKSPACE_NAME: superset
          TARGET_ARCH: x64
          DESKTOP_BUNDLE_CLI: ${{ inputs.bundle_cli }}
        run: bun run compile:app

      - name: Report package size after compile
        working-directory: apps/desktop
        run: bun run report:size --top=15

      - name: Install target platform optional dependencies
        run: bun install --frozen --ignore-scripts --minimum-release-age=0 --cpu=x64 --os=linux

      - name: Build desktop resource packs
        working-directory: apps/desktop
        env:
          BUNDLE_CLI: ${{ inputs.bundle_cli }}
          SUPERSET_RESOURCE_PACK_BASE_URL: ${{ secrets.SUPERSET_RESOURCE_PACK_BASE_URL }}
          TARGET_ARCH: x64
          TARGET_PLATFORM: linux
          UPLOAD_RESOURCE_PACK_ARTIFACTS: ${{ inputs.upload_resource_pack_artifacts }}
        run: |
          if [[ "$UPLOAD_RESOURCE_PACK_ARTIFACTS" != "true" ]]; then
            echo "::notice::Skipping runtime pack build for artifact-only validation."
            mkdir -p dist/resources/pack-system
            cp src/resources/pack-system/pack-manifest-index.json dist/resources/pack-system/pack-manifest-index.json
            exit 0
          fi
          bun run build:trellis-pack -- --out-dir dist/resource-packs --app-index-out dist/resources/pack-system/pack-manifest-index.json
          bun run build:claude-agent-pack -- --out-dir dist/resource-packs --app-index-out dist/resources/pack-system/pack-manifest-index.json
          bun run build:mastracode-pack -- --out-dir dist/resource-packs --app-index-out dist/resources/pack-system/pack-manifest-index.json
          if [[ "$BUNDLE_CLI" != "true" && "$UPLOAD_RESOURCE_PACK_ARTIFACTS" == "true" ]]; then
            bun run build:cli-pack -- --out-dir dist/resource-packs --app-index-out dist/resources/pack-system/pack-manifest-index.json
          else
            echo "::notice::Skipping Superset CLI runtime pack (bundle_cli=$BUNDLE_CLI, upload_resource_pack_artifacts=$UPLOAD_RESOURCE_PACK_ARTIFACTS)."
          fi
          bun run validate:trellis-runtime -- --node-modules dist/resource-packs/trellis-runtime/*/node_modules

      - name: Upload desktop resource pack artifact
        if: inputs.upload_resource_pack_artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ inputs.artifact_prefix }}-linux-resource-packs
          path: apps/desktop/dist/resource-packs/**
          retention-days: ${{ inputs.artifact_retention_days }}
          if-no-files-found: error

      - name: Upload desktop resource packs to object storage
        if: inputs.upload_resource_pack_artifacts
        working-directory: apps/desktop
        env:
          SUPERSET_OBJECT_STORAGE_ENDPOINT: ${{ secrets.SUPERSET_OBJECT_STORAGE_ENDPOINT }}
          SUPERSET_OBJECT_STORAGE_BUCKET: ${{ secrets.SUPERSET_OBJECT_STORAGE_BUCKET }}
          SUPERSET_OBJECT_STORAGE_REGION: ${{ secrets.SUPERSET_OBJECT_STORAGE_REGION }}
          SUPERSET_OBJECT_STORAGE_ACCESS_KEY: ${{ secrets.SUPERSET_OBJECT_STORAGE_ACCESS_KEY }}
          SUPERSET_OBJECT_STORAGE_SECRET_KEY: ${{ secrets.SUPERSET_OBJECT_STORAGE_SECRET_KEY }}
          SUPERSET_OBJECT_STORAGE_FORCE_PATH_STYLE: ${{ secrets.SUPERSET_OBJECT_STORAGE_FORCE_PATH_STYLE }}
          REQUIRE_RESOURCE_PACK_OBJECT_STORAGE: ${{ inputs.require_resource_pack_object_storage }}
        run: |
          if [[ -z "${SUPERSET_OBJECT_STORAGE_ENDPOINT:-}" || -z "${SUPERSET_OBJECT_STORAGE_BUCKET:-}" || -z "${SUPERSET_OBJECT_STORAGE_ACCESS_KEY:-}" || -z "${SUPERSET_OBJECT_STORAGE_SECRET_KEY:-}" ]]; then
            if [[ "$REQUIRE_RESOURCE_PACK_OBJECT_STORAGE" == "true" ]]; then
              echo "::error::Published desktop builds require SUPERSET_OBJECT_STORAGE_* secrets so on-demand resource packs are available to users."
              exit 1
            fi
            echo "::warning::Skipping desktop resource pack object-storage upload because SUPERSET_OBJECT_STORAGE_* secrets are incomplete."
            exit 0
          fi
          bun run upload:resource-packs -- --pack-dir dist/resource-packs --prefix packs

      - name: Prepare native runtime modules
        working-directory: apps/desktop
        env:
          TARGET_ARCH: x64
          TARGET_PLATFORM: linux
        run: |
          bun run copy:native-modules
          bun run validate:native-runtime

      - name: Build Electron app
        working-directory: apps/desktop
        env:
          TARGET_ARCH: x64
          TARGET_PLATFORM: linux
          ELECTRON_BUILDER_NPM_REBUILD: "false"
        run: node ./node_modules/electron-builder/cli.js --publish never --config ${{ inputs.electron_builder_config }}

      - name: Check package size budget
        working-directory: apps/desktop
        run: bun run check:package-budget -- --require-artifacts

      - name: Verify resource pack runtimes are pack-only
        working-directory: apps/desktop
        run: |
          if find release \( -path "*/resources/node_modules/@mindfoldhq/trellis*" -o -path "*/resources/node_modules/@anthropic-ai/claude-agent-sdk*" -o -path "*/resources/node_modules/@anthropic-ai/sdk*" -o -path "*/resources/node_modules/@browserbasehq*" -o -path "*/resources/node_modules/@modelcontextprotocol/sdk*" -o -path "*/resources/node_modules/json-schema-to-ts*" -o -path "*/resources/node_modules/ts-algebra*" -o -path "*/resources/node_modules/mastracode*" -o -path "*/resources/node_modules/@mastra/agent-browser*" -o -path "*/resources/node_modules/@mastra/duckdb*" -o -path "*/resources/node_modules/@mastra/memory*" -o -path "*/resources/node_modules/@mastra/stagehand*" -o -path "*/resources/node_modules/@duckdb*" -o -path "*/resources/node_modules/chromium-bidi*" -o -path "*/resources/node_modules/patchright-core*" -o -path "*/resources/node_modules/playwright*" -o -path "*/resources/node_modules/playwright-core*" -o -path "*/resources/node_modules/webdriver*" -o -path "*/resources/node_modules/webdriverio*" \) -print -quit | grep -q .; then
            echo "::error::Trellis, Claude Agent, and MastraCode/DuckDB runtimes must be delivered by resource packs, not bundled in app resources."
            exit 1
          fi
          ASAR_PATH="release/linux-unpacked/resources/app.asar" NODE_PATH="../../node_modules/.bun/node_modules" node <<'NODE'
          const asar = require("@electron/asar");
          const entries = asar.listPackage(process.env.ASAR_PATH);
          const forbidden = entries.filter((entry) =>
            entry.includes("/node_modules/@mindfoldhq/trellis") ||
            entry.includes("/node_modules/@anthropic-ai/claude-agent-sdk") ||
            entry.includes("/node_modules/@anthropic-ai/sdk") ||
            entry.includes("/node_modules/@browserbasehq") ||
            entry.includes("/node_modules/@modelcontextprotocol/sdk") ||
            entry.includes("/node_modules/json-schema-to-ts") ||
            entry.includes("/node_modules/ts-algebra") ||
            entry.includes("/node_modules/mastracode") ||
            entry.includes("/node_modules/@mastra/agent-browser") ||
            entry.includes("/node_modules/@mastra/duckdb") ||
            entry.includes("/node_modules/@mastra/memory") ||
            entry.includes("/node_modules/@mastra/stagehand") ||
            entry.includes("/node_modules/@duckdb") ||
            entry.includes("/node_modules/chromium-bidi") ||
            entry.includes("/node_modules/patchright-core") ||
            entry.includes("/node_modules/playwright") ||
            entry.includes("/node_modules/playwright-core") ||
            entry.includes("/node_modules/webdriver") ||
            entry.includes("/node_modules/webdriverio") ||
            entry.includes("/dist/resource-packs")
          );
          if (forbidden.length > 0) {
            console.error("::error::Resource-pack runtime payloads must not be bundled in app.asar.");
            console.error(forbidden.slice(0, 20).join("\n"));
            process.exit(1);
          }
          NODE
          test -f dist/resources/pack-system/pack-manifest-index.json

      - name: Verify Linux AppImage, update manifest, and CLI delivery
        working-directory: apps/desktop
        env:
          BUNDLE_CLI: ${{ inputs.bundle_cli }}
        run: |
          ls -la release
          test -n "$(ls -1 release/*.AppImage 2>/dev/null)" || {
            echo "::error::No AppImage artifact generated in apps/desktop/release"
            exit 1
          }
          test -n "$(ls -1 release/*-linux.yml 2>/dev/null)" || {
            echo "::error::No Linux auto-update manifest generated in apps/desktop/release"
            exit 1
          }
          CLI_BIN=$(find release -path "*/resources/resources/bin/superset" -type f -perm -111 | head -1)
          if [[ "$BUNDLE_CLI" == "true" ]]; then
            if [ -z "$CLI_BIN" ]; then
              echo "::error::Bundled Superset CLI missing or not executable in packaged Linux output"
              exit 1
            fi
            "$CLI_BIN" --version
          else
            if [[ -n "$CLI_BIN" ]]; then
              echo "::error::Bundled Superset CLI should not exist when bundle_cli=false: $CLI_BIN"
              exit 1
            fi
            CLI_PACK_BIN=$(find dist/resource-packs/superset-cli-runtime -path "*/bin/superset" -type f -perm -111 | head -1)
            if [[ -z "$CLI_PACK_BIN" ]]; then
              echo "::error::Superset CLI runtime pack binary missing while bundle_cli=false"
              find dist/resource-packs/superset-cli-runtime -maxdepth 4 -type f 2>/dev/null || true
              exit 1
            fi
            "$CLI_PACK_BIN" --version
          fi

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ inputs.artifact_prefix }}-linux-appimage
          path: apps/desktop/release/*.AppImage
          retention-days: ${{ inputs.artifact_retention_days }}
          if-no-files-found: error

      - name: Upload Linux auto-update manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ inputs.artifact_prefix }}-linux-update-manifest
          path: apps/desktop/release/*-linux.yml
          retention-days: ${{ inputs.artifact_retention_days }}
          if-no-files-found: error
