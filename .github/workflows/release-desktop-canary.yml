name: Release Desktop Canary

on:
  schedule:
    # Every 12 hours at 12 AM and 12 PM UTC
    - cron: "0 0,12 * * *"
  workflow_dispatch:
    inputs:
      force_build:
        description: "Force build even if no changes detected"
        required: false
        type: boolean
        default: false
      build_scope:
        description: "Canary artifact scope"
        required: false
        type: choice
        default: quick
        options:
          - quick
          - full
      mac_signing:
        description: "macOS signing mode"
        required: false
        type: choice
        default: auto
        options:
          - auto
          - required
          - unsigned_internal
      publish_release:
        description: "Update the desktop-canary GitHub Release after building"
        required: false
        type: boolean
        default: true

permissions:
  actions: read
  contents: write

jobs:
  check-changes:
    name: Check for changes
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      short_sha: ${{ steps.check.outputs.short_sha }}
      build_time: ${{ steps.check.outputs.build_time }}
      version_timestamp: ${{ steps.check.outputs.version_timestamp }}
      build_scope: ${{ steps.check.outputs.build_scope }}
      macos_arches_json: ${{ steps.check.outputs.macos_arches_json }}
      macos_artifact_mode: ${{ steps.check.outputs.macos_artifact_mode }}
      build_linux: ${{ steps.check.outputs.build_linux }}
      mac_signing: ${{ steps.check.outputs.mac_signing }}
      upload_resource_pack_artifacts: ${{ steps.check.outputs.upload_resource_pack_artifacts }}
      bundle_cli: ${{ steps.check.outputs.bundle_cli }}
      upload_sourcemaps: ${{ steps.check.outputs.upload_sourcemaps }}
      capture_compile_bundle_stats: ${{ steps.check.outputs.capture_compile_bundle_stats }}
      capture_runtime_performance: ${{ steps.check.outputs.capture_runtime_performance }}

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: ${{ github.event.inputs.force_build == 'true' && 1 || 0 }}

      - name: Check for changes since last canary
        id: check
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT

          # Capture build timestamp (works for both scheduled and manual runs)
          BUILD_TIME=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          echo "build_time=$BUILD_TIME" >> $GITHUB_OUTPUT

          # Version timestamp for unique canary versions (YYYYMMDDHHMMSS format)
          # This ensures each canary build has a unique, incrementing version
          VERSION_TIMESTAMP=$(date -u +'%Y%m%d%H%M%S')
          echo "version_timestamp=$VERSION_TIMESTAMP" >> $GITHUB_OUTPUT

          FORCE_BUILD="${{ github.event.inputs.force_build }}"
          BUILD_SCOPE="${{ github.event.inputs.build_scope }}"
          MAC_SIGNING="${{ github.event.inputs.mac_signing }}"
          PUBLISH_RELEASE="${{ github.event.inputs.publish_release }}"

          if [ -z "$BUILD_SCOPE" ]; then
            BUILD_SCOPE="quick"
          fi

          if [ -z "$MAC_SIGNING" ]; then
            MAC_SIGNING="auto"
          fi

          if [ -z "$PUBLISH_RELEASE" ]; then
            PUBLISH_RELEASE="true"
          fi

          case "$BUILD_SCOPE" in
            quick)
              echo "Quick canary requested: macOS arm64."
              echo 'macos_arches_json=["arm64"]' >> $GITHUB_OUTPUT
              echo "build_linux=false" >> $GITHUB_OUTPUT
              if [[ "$PUBLISH_RELEASE" == "false" ]]; then
                echo "macos_artifact_mode=zip_only" >> $GITHUB_OUTPUT
              else
                echo "macos_artifact_mode=full" >> $GITHUB_OUTPUT
              fi
              ;;
            full)
              echo "Full canary requested: macOS arm64/x64 + Linux x64."
              echo 'macos_arches_json=["arm64","x64"]' >> $GITHUB_OUTPUT
              echo "build_linux=true" >> $GITHUB_OUTPUT
              echo "macos_artifact_mode=full" >> $GITHUB_OUTPUT
              ;;
            *)
              echo "::error::Unsupported build_scope: $BUILD_SCOPE"
              exit 1
              ;;
          esac

          case "$MAC_SIGNING" in
            auto|required|unsigned_internal)
              ;;
            *)
              echo "::error::Unsupported mac_signing mode: $MAC_SIGNING"
              exit 1
              ;;
          esac

          echo "build_scope=$BUILD_SCOPE" >> $GITHUB_OUTPUT
          echo "mac_signing=$MAC_SIGNING" >> $GITHUB_OUTPUT
          if [[ "$BUILD_SCOPE" == "quick" && "$PUBLISH_RELEASE" == "false" ]]; then
            echo "Artifact-only quick validation requested: building macOS updater ZIP only."
            echo "upload_resource_pack_artifacts=false" >> $GITHUB_OUTPUT
            echo "bundle_cli=false" >> $GITHUB_OUTPUT
            echo "upload_sourcemaps=false" >> $GITHUB_OUTPUT
            echo "capture_compile_bundle_stats=false" >> $GITHUB_OUTPUT
            echo "capture_runtime_performance=false" >> $GITHUB_OUTPUT
          elif [[ "$BUILD_SCOPE" == "quick" ]]; then
            echo "Published quick canary requested: uploading resource packs and building macOS ZIP+DMG without runtime telemetry."
            echo "upload_resource_pack_artifacts=true" >> $GITHUB_OUTPUT
            echo "bundle_cli=false" >> $GITHUB_OUTPUT
            echo "upload_sourcemaps=false" >> $GITHUB_OUTPUT
            echo "capture_compile_bundle_stats=false" >> $GITHUB_OUTPUT
            echo "capture_runtime_performance=false" >> $GITHUB_OUTPUT
          else
            echo "upload_resource_pack_artifacts=true" >> $GITHUB_OUTPUT
            echo "bundle_cli=false" >> $GITHUB_OUTPUT
            echo "upload_sourcemaps=true" >> $GITHUB_OUTPUT
            echo "capture_compile_bundle_stats=true" >> $GITHUB_OUTPUT
            echo "capture_runtime_performance=true" >> $GITHUB_OUTPUT
          fi

          if [ "$FORCE_BUILD" = "true" ]; then
            echo "Force build requested, skipping change detection..."
            echo "should_build=true" >> $GITHUB_OUTPUT
          else
            # Get the commit SHA of the last canary release
            LAST_CANARY_SHA=$(git rev-parse desktop-canary 2>/dev/null || echo "")

            if [ -z "$LAST_CANARY_SHA" ]; then
              echo "No previous canary release found, building..."
              echo "should_build=true" >> $GITHUB_OUTPUT
            elif [ "$LAST_CANARY_SHA" = "$(git rev-parse HEAD)" ]; then
              echo "No changes since last canary release, skipping..."
              echo "should_build=false" >> $GITHUB_OUTPUT
            else
              echo "Changes detected since last canary, building..."
              echo "should_build=true" >> $GITHUB_OUTPUT
            fi
          fi

  build:
    needs: check-changes
    if: needs.check-changes.outputs.should_build == 'true'
    uses: ./.github/workflows/build-desktop.yml
    with:
      channel: canary
      version_suffix: "-canary.${{ needs.check-changes.outputs.version_timestamp }}"
      electron_builder_config: electron-builder.canary.ts
      artifact_prefix: desktop-canary
      artifact_retention_days: 7
      build_macos: true
      macos_runner: ${{ vars.DESKTOP_CANARY_MACOS_RUNNER || 'macos-latest' }}
      macos_arches_json: ${{ needs.check-changes.outputs.macos_arches_json }}
      build_linux: ${{ needs.check-changes.outputs.build_linux == 'true' }}
      mac_signing: ${{ needs.check-changes.outputs.mac_signing }}
      macos_artifact_mode: ${{ needs.check-changes.outputs.macos_artifact_mode }}
      upload_resource_pack_artifacts: ${{ needs.check-changes.outputs.build_scope != 'quick' && needs.check-changes.outputs.upload_resource_pack_artifacts == 'true' }}
      upload_resource_pack_object_storage: ${{ needs.check-changes.outputs.build_scope != 'quick' && needs.check-changes.outputs.upload_resource_pack_artifacts == 'true' }}
      require_resource_pack_object_storage: ${{ github.event.inputs.publish_release != 'false' }}
      bundle_cli: ${{ needs.check-changes.outputs.bundle_cli == 'true' }}
      upload_sourcemaps: ${{ needs.check-changes.outputs.upload_sourcemaps == 'true' }}
      parallel_compile: ${{ needs.check-changes.outputs.build_scope == 'quick' }}
      capture_compile_bundle_stats: ${{ needs.check-changes.outputs.capture_compile_bundle_stats == 'true' }}
      capture_runtime_performance: ${{ needs.check-changes.outputs.capture_runtime_performance == 'true' }}
    secrets: inherit

  resource-packs:
    name: Build and upload quick resource packs
    needs: check-changes
    if: needs.check-changes.outputs.should_build == 'true' && needs.check-changes.outputs.build_scope == 'quick' && needs.check-changes.outputs.upload_resource_pack_artifacts == 'true'
    runs-on: ${{ vars.DESKTOP_CANARY_MACOS_RUNNER || 'macos-latest' }}
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        id: setup-bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Cache dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ steps.setup-bun.outputs.bun-revision }}-${{ hashFiles('bun.lock', 'package.json', 'apps/desktop/package.json', 'packages/*/package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-${{ steps.setup-bun.outputs.bun-revision }}-

      - name: Cache desktop resource packs
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            apps/desktop/dist/resource-packs
            apps/desktop/dist/resources/pack-system/pack-manifest-index.json
          key: ${{ runner.os }}-arm64-desktop-resource-packs-${{ hashFiles('bun.lock', 'apps/desktop/package.json', 'apps/desktop/scripts/build-*runtime-pack.ts', 'apps/desktop/scripts/*runtime-pack-dependencies.ts', 'apps/desktop/scripts/resource-pack-archive.ts', 'apps/desktop/src/main/lib/pack-system/types.ts', 'apps/desktop/src/main/lib/pack-system/pack-manifest.schema.json', 'packages/cli/package.json', 'packages/cli/src/**') }}
          restore-keys: |
            ${{ runner.os }}-arm64-desktop-resource-packs-

      - name: Install dependencies
        run: bun install --frozen --ignore-scripts --minimum-release-age=0

      - name: Check desktop resource pack cache
        id: resource-pack-cache
        working-directory: apps/desktop
        env:
          BUNDLE_CLI: "false"
          SUPERSET_RESOURCE_PACK_BASE_URL: ${{ secrets.SUPERSET_RESOURCE_PACK_BASE_URL }}
          TARGET_ARCH: arm64
          TARGET_PLATFORM: darwin
        run: |
          if bun run check:resource-pack-cache \
            -- --pack-dir dist/resource-packs \
            --app-index-out dist/resources/pack-system/pack-manifest-index.json \
            --base-url "${SUPERSET_RESOURCE_PACK_BASE_URL:-https://cdn.superset.sh/packs}" \
            --bundle-cli "$BUNDLE_CLI"; then
            echo "cache_hit=true" >> "$GITHUB_OUTPUT"
          else
            echo "cache_hit=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install target platform optional dependencies
        if: steps.resource-pack-cache.outputs.cache_hit != 'true'
        run: bun install --frozen --ignore-scripts --minimum-release-age=0 --cpu=arm64 --os=darwin

      - name: Build desktop resource packs
        if: steps.resource-pack-cache.outputs.cache_hit != 'true'
        working-directory: apps/desktop
        env:
          BUNDLE_CLI: "false"
          SUPERSET_RESOURCE_PACK_BASE_URL: ${{ secrets.SUPERSET_RESOURCE_PACK_BASE_URL }}
          TARGET_ARCH: arm64
          TARGET_PLATFORM: darwin
        run: |
          bun run build:trellis-pack -- --out-dir dist/resource-packs --app-index-out dist/resources/pack-system/pack-manifest-index.json
          bun run build:claude-agent-pack -- --out-dir dist/resource-packs --app-index-out dist/resources/pack-system/pack-manifest-index.json
          bun run build:mastracode-pack -- --out-dir dist/resource-packs --app-index-out dist/resources/pack-system/pack-manifest-index.json
          bun run build:cli-pack -- --out-dir dist/resource-packs --app-index-out dist/resources/pack-system/pack-manifest-index.json
          bun run validate:trellis-runtime -- --node-modules dist/resource-packs/trellis-runtime/*/node_modules

      - name: Upload desktop resource packs to object storage
        working-directory: apps/desktop
        env:
          SUPERSET_OBJECT_STORAGE_ENDPOINT: ${{ secrets.SUPERSET_OBJECT_STORAGE_ENDPOINT }}
          SUPERSET_OBJECT_STORAGE_BUCKET: ${{ secrets.SUPERSET_OBJECT_STORAGE_BUCKET }}
          SUPERSET_OBJECT_STORAGE_REGION: ${{ secrets.SUPERSET_OBJECT_STORAGE_REGION }}
          SUPERSET_OBJECT_STORAGE_ACCESS_KEY: ${{ secrets.SUPERSET_OBJECT_STORAGE_ACCESS_KEY }}
          SUPERSET_OBJECT_STORAGE_SECRET_KEY: ${{ secrets.SUPERSET_OBJECT_STORAGE_SECRET_KEY }}
          SUPERSET_OBJECT_STORAGE_FORCE_PATH_STYLE: ${{ secrets.SUPERSET_OBJECT_STORAGE_FORCE_PATH_STYLE }}
          SUPERSET_RESOURCE_PACK_BASE_URL: ${{ secrets.SUPERSET_RESOURCE_PACK_BASE_URL }}
        run: |
          bun run check:resource-pack-release-readiness
          bun run upload:resource-packs -- --pack-dir dist/resource-packs --prefix packs --include-loose-files=false --skip-existing=false
          bun run verify:resource-pack-downloads -- --index dist/resource-packs/pack-manifest-index.json --include-loose-files=false

  resource-pack-release-preflight:
    name: Check quick resource pack release config
    needs: check-changes
    if: needs.check-changes.outputs.should_build == 'true' && needs.check-changes.outputs.build_scope == 'quick' && needs.check-changes.outputs.upload_resource_pack_artifacts == 'true' && github.event.inputs.publish_release != 'false'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Verify object-storage release secrets are present
        env:
          SUPERSET_OBJECT_STORAGE_ENDPOINT: ${{ secrets.SUPERSET_OBJECT_STORAGE_ENDPOINT }}
          SUPERSET_OBJECT_STORAGE_BUCKET: ${{ secrets.SUPERSET_OBJECT_STORAGE_BUCKET }}
          SUPERSET_OBJECT_STORAGE_REGION: ${{ secrets.SUPERSET_OBJECT_STORAGE_REGION }}
          SUPERSET_OBJECT_STORAGE_ACCESS_KEY: ${{ secrets.SUPERSET_OBJECT_STORAGE_ACCESS_KEY }}
          SUPERSET_OBJECT_STORAGE_SECRET_KEY: ${{ secrets.SUPERSET_OBJECT_STORAGE_SECRET_KEY }}
          SUPERSET_RESOURCE_PACK_BASE_URL: ${{ secrets.SUPERSET_RESOURCE_PACK_BASE_URL }}
        run: |
          missing=()
          for name in \
            SUPERSET_OBJECT_STORAGE_ENDPOINT \
            SUPERSET_OBJECT_STORAGE_BUCKET \
            SUPERSET_OBJECT_STORAGE_REGION \
            SUPERSET_OBJECT_STORAGE_ACCESS_KEY \
            SUPERSET_OBJECT_STORAGE_SECRET_KEY \
            SUPERSET_RESOURCE_PACK_BASE_URL; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf '::error::Published quick canary requires object-storage resource-pack secrets before updating the GitHub Release. Missing: %s\n' "${missing[*]}"
            exit 1
          fi

  release:
    name: Update Canary Release
    needs: [check-changes, build, resource-packs, resource-pack-release-preflight]
    if: always() && needs.check-changes.outputs.should_build == 'true' && needs.build.result == 'success' && (needs.resource-packs.result == 'success' || needs.resource-packs.result == 'skipped') && (needs.resource-pack-release-preflight.result == 'success' || needs.resource-pack-release-preflight.result == 'skipped') && github.event.inputs.publish_release != 'false'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Create release body
        env:
          BUILD_SCOPE: ${{ needs.check-changes.outputs.build_scope }}
          BUILD_TIME: ${{ needs.check-changes.outputs.build_time }}
          MAC_CERTIFICATE: ${{ secrets.MAC_CERTIFICATE }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          MAC_APPLE_ID: ${{ secrets.APPLE_ID }}
          MAC_APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          MAC_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MAC_SIGNING: ${{ needs.check-changes.outputs.mac_signing }}
          REF_NAME: ${{ github.ref_name }}
          SHORT_SHA: ${{ needs.check-changes.outputs.short_sha }}
        run: |
          if [[ "$MAC_SIGNING" == "unsigned_internal" ]]; then
            MAC_SIGNING_STATUS="Ad-hoc signed internal build"
            MAC_SIGNING_NOTES="This build is ad-hoc signed but not Developer ID notarized. For internal testing only, install the app and run: \`xattr -dr com.apple.quarantine /Applications/Superset\\ Canary.app\`"
          elif [[ -n "${MAC_CERTIFICATE:-}" && -n "${MAC_CERTIFICATE_PASSWORD:-}" && -n "${MAC_APPLE_ID:-}" && -n "${MAC_APPLE_ID_PASSWORD:-}" && -n "${MAC_APPLE_TEAM_ID:-}" ]]; then
            MAC_SIGNING_STATUS="Developer ID signed and notarized"
            MAC_SIGNING_NOTES="macOS artifacts are expected to open normally after download."
          else
            MAC_SIGNING_STATUS="Ad-hoc signed internal build"
            MAC_SIGNING_NOTES="This build is ad-hoc signed because Developer ID signing/notarization secrets are incomplete. For internal testing only, install the app and run: \`xattr -dr com.apple.quarantine /Applications/Superset\\ Canary.app\`"
          fi

          cat > release-body.md <<EOF
          **Internal Testing Build**

          This is an automated canary build from \`${REF_NAME}\` ref.

          - Commit: ${{ github.sha }}
          - Short SHA: ${SHORT_SHA}
          - Built: ${BUILD_TIME}
          - Build scope: ${BUILD_SCOPE}
          - macOS signing mode: ${MAC_SIGNING}
          - macOS signing status: ${MAC_SIGNING_STATUS}

          ${MAC_SIGNING_NOTES}

          This build is for internal testing only and may be unstable.
          EOF

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: release-artifacts
          pattern: desktop-canary-*
          merge-multiple: true

      - name: Remove resource-pack CI payloads from release assets
        run: |
          rm -rf \
            release-artifacts/trellis-runtime \
            release-artifacts/claude-agent-runtime \
            release-artifacts/mastracode-runtime \
            release-artifacts/superset-cli-runtime \
            release-artifacts/pack-manifest-index.json

      - name: Merge macOS auto-update manifests
        uses: ./.github/actions/merge-mac-manifests
        with:
          artifact-prefix: desktop-canary
          extra-manifest-names: canary-mac.yml

      - name: Create canary-named copies for updater URLs
        run: |
          cd release-artifacts
          for file in *.AppImage; do
            if [[ -f "$file" ]]; then
              arch=$(echo "$file" | sed -E 's/.*-([^-]+)\.AppImage$/\1/')
              cp "$file" "Superset-Canary-${arch}.AppImage"
              echo "Created canary copy: Superset-Canary-${arch}.AppImage"
            fi
          done
          # Prerelease builds may request canary-linux.yml; keep latest-linux.yml as fallback.
          for file in *-linux.yml; do
            if [[ -f "$file" && "$file" != "canary-linux.yml" && "$file" != "latest-linux.yml" ]]; then
              cp "$file" "canary-linux.yml"
              cp "$file" "latest-linux.yml"
              echo "Created canary manifests: canary-linux.yml, latest-linux.yml from $file"
              break
            fi
          done

      - name: List artifacts
        run: |
          echo "Release artifacts:"
          ls -la release-artifacts/

      - name: Delete existing canary release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Delete existing release if it exists
          gh release delete desktop-canary --yes || true
          # Delete the tag
          git push origin :refs/tags/desktop-canary || true

      - name: Create Canary Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: desktop-canary
          name: "Superset Desktop Canary"
          body_path: release-body.md
          prerelease: true
          files: release-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check Canary build duration budget
        working-directory: apps/desktop
        env:
          BUILD_SCOPE: ${{ needs.check-changes.outputs.build_scope }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH_RELEASE: "true"
        run: bun run check:canary-build-duration -- --run-id "${{ github.run_id }}" --exclude-job-name "quick resource packs"

  check-resource-pack-duration:
    name: Check quick resource pack duration budget
    needs: [check-changes, resource-packs]
    if: always() && needs.check-changes.outputs.should_build == 'true' && needs.check-changes.outputs.build_scope == 'quick' && needs.check-changes.outputs.upload_resource_pack_artifacts == 'true' && needs.resource-packs.result == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Check quick resource pack duration budget
        working-directory: apps/desktop
        env:
          BUILD_SCOPE: ${{ needs.check-changes.outputs.build_scope }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH_RELEASE: "true"
        run: bun run check:canary-build-duration -- --run-id "${{ github.run_id }}" --include-job-name "quick resource packs"

  check-build-duration:
    name: Check Canary build duration budget
    needs: [check-changes, build]
    if: needs.check-changes.outputs.should_build == 'true' && github.event.inputs.publish_release == 'false'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Check Canary build duration budget
        working-directory: apps/desktop
        env:
          BUILD_SCOPE: ${{ needs.check-changes.outputs.build_scope }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH_RELEASE: "false"
        run: bun run check:canary-build-duration -- --run-id "${{ github.run_id }}"
