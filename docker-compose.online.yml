services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "43001:3001"
    env_file:
      - ${SUPERSET_ONLINE_ENV_FILE:-.env.online}
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3001
      SUPERSET_NEXT_DIST_DIR: .next-online
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neon-proxy:
        condition: service_started
      kv-rest:
        condition: service_started
      electric:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/api/auth/get-session').then((r)=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "43000:3000"
    env_file:
      - ${SUPERSET_ONLINE_ENV_FILE:-.env.online}
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      SUPERSET_NEXT_DIST_DIR: .next-online
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/sign-in').then((r)=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  relay:
    build:
      context: .
      dockerfile: apps/relay/Dockerfile
    ports:
      - "43013:8080"
    env_file:
      - ${SUPERSET_ONLINE_ENV_FILE:-.env.online}
    environment:
      NODE_ENV: production
      RELAY_PORT: 8080
    depends_on:
      redis:
        condition: service_healthy
      kv-rest:
        condition: service_started
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://127.0.0.1:8080/health').then((r)=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  electric-proxy:
    build:
      context: .
      dockerfile: apps/electric-proxy/Dockerfile
    ports:
      - "43012:8787"
    env_file:
      - ${SUPERSET_ONLINE_ENV_FILE:-.env.online}
    environment:
      NODE_ENV: production
      PORT: 8787
    depends_on:
      electric:
        condition: service_started
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://127.0.0.1:8787/v1/shape').then((r)=>process.exit(r.status===401?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
